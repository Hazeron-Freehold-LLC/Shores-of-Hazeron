# Shores of Hazeron Server Settings
[Settings]
# loginName is the server account name to use when logging in to the login server. This is needed to validate the server itself and
# it is also needed for the server to send mail.
;loginName =
loginName=u1s0

# netName is a DNS name that resolves to this computer's IP address. netName is needed by all server roles except the master, whose
# netName is defined in auutil.h as "Scene.Hazeron.net".
;netName=
netName=u1d.Hazeron.net

# scenePort is the port number on which to listen for client scene channel connections. scenePort is needed by all server roles
# except master, whose scenePort is defined in auutil.h as 16759.
;scenePort=16759

# chatPort is the port number on which to listen for client chat channel connections. This is typically the scenePort+1.
# Only needed when serverRole is worker.
# The default 0 produces an error message on the worker.
;chatPort=0

# mgrPort is the port number on which to listen for connections from the server manager program. It is programmed with this port
# number for each server. Changes here will require changes there.
# The default 0 produces an error message.
;mgrPort=0
mgrPort=16762

# atomManagers is the number of atom manager bundles that will be created. atomManagers is only used by worker servers.
# The default is 3/4 of the QThread::idealThreadCount, minimum of 1.
;atomManagers=0

# bossName is the name of my boss server. Default behavior starts at the scene master and worker gets handed off to a manager.
;bossName=

# loginPass is the clear text password for the server loginName account. :/
;loginName =
loginPass=Au*Server

# serverRole defines the tasks carried out by the server and how it fits into the server management structure.
# serverRole can be master, manager, or worker.
;serverRole=worker
serverRole=manager
